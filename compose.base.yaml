# this file contains base definitions for composing the project locally
# for concrete scenarios, use paired with .dev or .qa files
# all services by default are deactivated (none profile), attach them to real profiles to use


x-common-env-file: &common-env-file
  env_file:
    - path: .env
      required: false
    - path: .env.local
      required: false


services:

  nginx:
    image: ${SHALLWE_GLOBAL_DOCKER_REGISTRY_URL}nginx:${SHALLWE_GLOBAL_DOCKER_NGINX_IMAGE_TAG:?}
    <<: *common-env-file
    environment:
      SHALLWE_GLOBAL_SITE_URL_INTERNAL: http://frontend:3000
      NEXT_PUBLIC_SHALLWE_API_BASE_URL_INTERNAL: http://backend:8000
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - staticfiles:/app/staticfiles    # static volume for shared access with backend
      - media:/app/media                # ^ same for media
    depends_on:
      - backend
      - frontend
    ports:
      - "8080:80"  # prevents from clashing with host nginx if running
    profiles: [none]  # suppress by default


  db:
    image: postgres:16.9-alpine
    <<: *common-env-file
    environment:
      POSTGRES_USER: ${SHALLWE_BACKEND_DB_USER:?}
      POSTGRES_PASSWORD: ${SHALLWE_BACKEND_DB_PASS:?}
      POSTGRES_DB: ${SHALLWE_BACKEND_DB_NAME:?}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5434:${SHALLWE_BACKEND_DB_PORT}"
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${SHALLWE_BACKEND_DB_USER}" ]
      interval: 5s
      retries: 5
    restart: always
    profiles: [none]  # suppress by default


  backend:
    image: ${SHALLWE_GLOBAL_DOCKER_REGISTRY_URL}backend:${SHALLWE_GLOBAL_DOCKER_BACKEND_IMAGE_TAG:?}
    <<: *common-env-file
    environment:
      # --- globals ---
      SHALLWE_GLOBAL_SITE_URL_EXTERNAL: ${SHALLWE_GLOBAL_SITE_URL_EXTERNAL:?}
      SHALLWE_GLOBAL_SITE_URL_INTERNAL: ${SHALLWE_GLOBAL_SITE_URL_INTERNAL:?}
      SHALLWE_GLOBAL_OAUTH_CLIENT_ID: ${SHALLWE_GLOBAL_OAUTH_CLIENT_ID:?}
      SHALLWE_GLOBAL_OAUTH_CLIENT_SECRET: ${SHALLWE_GLOBAL_OAUTH_CLIENT_SECRET:?}
      SHALLWE_GLOBAL_OAUTH_REDIRECT_URI: ${SHALLWE_GLOBAL_OAUTH_REDIRECT_URI:?}
      SHALLWE_GLOBAL_ENV_MODE: ${SHALLWE_GLOBAL_ENV_MODE:?}
      # --- django core ---
      SHALLWE_BACKEND_SECRET_KEY: ${SHALLWE_BACKEND_SECRET_KEY:?}
      SHALLWE_BACKEND_DEBUG_ON: ${SHALLWE_BACKEND_DEBUG_ON:?}
      # --- entrypoint ---
      SHALLWE_BACKEND_ENTRYPOINT_AUTORUN: ${SHALLWE_BACKEND_ENTRYPOINT_AUTORUN:?}
      SHALLWE_BACKEND_ENTRYPOINT_AUTOTEST: ${SHALLWE_BACKEND_ENTRYPOINT_AUTOTEST:?}
      # --- admin ---
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:?}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:?}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:?}
      # --- database ---
      SHALLWE_BACKEND_DB_HOST: ${SHALLWE_BACKEND_DB_HOST:?}
      SHALLWE_BACKEND_DB_PORT: ${SHALLWE_BACKEND_DB_PORT:?}
      SHALLWE_BACKEND_DB_NAME: ${SHALLWE_BACKEND_DB_NAME:?}
      SHALLWE_BACKEND_DB_USER: ${SHALLWE_BACKEND_DB_USER:?}
      SHALLWE_BACKEND_DB_PASS: ${SHALLWE_BACKEND_DB_PASS:?}
      # --- network ---
      SHALLWE_BACKEND_ALLOWED_HOSTS: ${SHALLWE_BACKEND_ALLOWED_HOSTS:?},backend
      SHALLWE_BACKEND_CSRF_TRUSTED_ORIGINS: ${SHALLWE_BACKEND_CSRF_TRUSTED_ORIGINS:?}
      SHALLWE_BACKEND_CORS_ALLOWED_ORIGINS: ${SHALLWE_BACKEND_CORS_ALLOWED_ORIGINS:?}
      SHALLWE_BACKEND_CREDENTIALS_COOKIE_DOMAIN: ${SHALLWE_BACKEND_CREDENTIALS_COOKIE_DOMAIN}
      # --- deepface ---
      SHALLWE_BACKEND_DEEPFACE_MODELS: ${SHALLWE_BACKEND_DEEPFACE_MODELS:?}
      # --- logs ---
      TF_CPP_MIN_LOG_LEVEL: ${TF_CPP_MIN_LOG_LEVEL:-3}
    volumes:
      - staticfiles:/app/staticfiles
      - media:/app/media
      - django_logs:/tmp/django
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    restart: on-failure
    profiles: [none]  # suppress by default


  frontend:
    image: ${SHALLWE_GLOBAL_DOCKER_REGISTRY_URL}mock-frontend:${SHALLWE_GLOBAL_DOCKER_FRONTEND_IMAGE_TAG:?}
    <<: *common-env-file
    environment:
      NEXT_PUBLIC_SHALLWE_ENV_MODE: ${NEXT_PUBLIC_SHALLWE_ENV_MODE:?}
      NEXT_PUBLIC_SHALLWE_OAUTH_CLIENT_ID: ${NEXT_PUBLIC_SHALLWE_OAUTH_CLIENT_ID:?}
      NEXT_PUBLIC_SHALLWE_OAUTH_REDIRECT_URI: ${NEXT_PUBLIC_SHALLWE_OAUTH_REDIRECT_URI:?}
      NEXT_PUBLIC_SHALLWE_API_BASE_URL_EXTERNAL: ${NEXT_PUBLIC_SHALLWE_API_BASE_URL_EXTERNAL}
      NEXT_PUBLIC_SHALLWE_API_BASE_URL_INTERNAL: http://backend:8000
      NEXT_PUBLIC_SHALLWE_SKIP_MIDDLEWARE: ${NEXT_PUBLIC_SHALLWE_SKIP_MIDDLEWARE:?}
    expose:
      - "3000"
    restart: on-failure
    profiles: [none]  # suppress by default


volumes:
  db_data:
  media:
  staticfiles:
  django_logs:
